  <rect x="150" y="118" width="98" height="62" rx="20" fill="none" stroke="#5c2b0b" stroke-width="3"/>
  <circle cx="182" cy="149" r="13" fill="url(#coin)"/>
  <!-- rising bars -->
  <rect x="48" y="170" width="16" height="32" rx="5" fill="#fff" opacity=".92"/>
  <rect x="76" y="148" width="16" height="54" rx="5" fill="#fff" opacity=".92"/>
  <rect x="104" y="124" width="16" height="78" rx="5" fill="#fff" opacity=".92"/>
