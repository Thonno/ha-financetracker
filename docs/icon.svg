<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbb04f"/><stop offset="1" stop-color="#e5762f"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9621f"/><stop offset="1" stop-color="#a94e17"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a8"/><stop offset="1" stop-color="#ffc85c"/>
    </linearGradient>
