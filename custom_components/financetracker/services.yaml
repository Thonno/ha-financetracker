add_transaction:
  fields:
    amount:
      required: true
      example: 12.50
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
    type:
      default: expense
      selector:
        select:
          translation_key: transaction_type
          options: ["expense", "income", "transfer"]
    category:
      example: Groceries
      selector:
        text:
    description:
      example: Supermarket
      selector:
        text:
    account:
      example: Current account
      selector:
        text:
    to_account:
      selector:
        text:
    method:
      example: Debit card
      selector:
        text:
    date:
      selector:
        date:
    note:
      selector:
        text:
    user:
      example: Mario
      selector:
        text:
register_recurring_expense:
  fields:
    expense:
      required: true
      example: Netflix
      selector:
        text:
    amount:
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
    date:
      selector:
        date:
    user:
      example: Mario
      selector:
        text:
